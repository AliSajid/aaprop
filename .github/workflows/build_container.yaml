---
name: Container Image Generation
on:
  workflow_call:
  workflow_dispatch:

env:
  DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
  DOCKER_REPOSITORY_NAME: ${{ vars.DOCKER_REPOSITORY_NAME }}
  REPOSITORY_NAME: ${{ github.event.repository.name }}
  COSIGN_RELEASE_VERSION: v2.2.4
  SYFT_VERSION: v1.7.0
  SOURCE_DATE_EPOCH: 0

jobs:
  podman-build-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Get Last Commit Date/Time for reproducible builds
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get -y install podman qemu-user-static

      - name: Setup Podman for multi-arch builds
        run: |
          podman version
          # Enable QEMU for multi-arch support
          sudo systemctl start systemd-binfmt.service || true
          # Test multi-arch support
          podman run --rm tonistiigi/binfmt --install all

      - name: Generate Container Metadata
        id: meta
        run: |
          # Generate tags
          TAGS=""
          DOCKER_HUB_IMAGE="${{env.DOCKER_REPOSITORY_NAME}}/${{env.REPOSITORY_NAME}}"
          GHCR_IMAGE="ghcr.io/${{ github.repository}}"

          # Add tags based on event type
          if [[ "${{ github.event_name }}" == "push" ]]; then
            BRANCH_NAME="${{ github.ref_name }}"
            TAGS="${DOCKER_HUB_IMAGE}:${BRANCH_NAME},${GHCR_IMAGE}:${BRANCH_NAME}"
          fi

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            if [[ -n "${TAGS}" ]]; then
              TAGS="${TAGS},${DOCKER_HUB_IMAGE}:${TAG_NAME},${GHCR_IMAGE}:${TAG_NAME}"
            else
              TAGS="${DOCKER_HUB_IMAGE}:${TAG_NAME},${GHCR_IMAGE}:${TAG_NAME}"
            fi
            TAGS="${TAGS},${DOCKER_HUB_IMAGE}:latest,${GHCR_IMAGE}:latest"
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            if [[ -n "${TAGS}" ]]; then
              TAGS="${TAGS},${DOCKER_HUB_IMAGE}:pr-${PR_NUMBER},${GHCR_IMAGE}:pr-${PR_NUMBER}"
            else
              TAGS="${DOCKER_HUB_IMAGE}:pr-${PR_NUMBER},${GHCR_IMAGE}:pr-${PR_NUMBER}"
            fi
          fi

          # Add SHA tag
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [[ -n "${TAGS}" ]]; then
            TAGS="${TAGS},${DOCKER_HUB_IMAGE}:sha-${SHORT_SHA},${GHCR_IMAGE}:sha-${SHORT_SHA}"
          else
            TAGS="${DOCKER_HUB_IMAGE}:sha-${SHORT_SHA},${GHCR_IMAGE}:sha-${SHORT_SHA}"
          fi

          # Export for later steps
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Generated tags: ${TAGS}"

          # Generate labels
          LABELS="org.opencontainers.image.licenses=MIT AND Apache-2.0"
          LABELS="${LABELS},org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
          LABELS="${LABELS},org.opencontainers.image.revision=${{ github.sha }}"
          LABELS="${LABELS},org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "labels=${LABELS}" >> $GITHUB_OUTPUT

      - name: Debug Metadata
        run: |
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo "Labels: ${{ steps.meta.outputs.labels }}"

      - name: Login to DockerHub
        run: |
          printf '%s' "${{ secrets.DOCKER_TOKEN }}" | podman login docker.io -u "${{ env.DOCKER_USERNAME }}" --password-stdin

      - name: Login to GitHub Container Registry
        run: |
          printf '%s' "${{ secrets.GHCR_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and Push Container Images
        id: build
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        run: |
          set -euo pipefail  # Exit on error, undefined variables, and pipe failures

          # Build images for each architecture and add to multi-arch manifest
          PLATFORMS="linux/amd64,linux/arm64"
          IFS=',' read -ra TAG_ARRAY <<< "${{ steps.meta.outputs.tags }}"
          IFS=',' read -ra PLATFORM_ARRAY <<< "${PLATFORMS}"
          IFS=',' read -ra LABEL_ARRAY <<< "${{ steps.meta.outputs.labels }}"

          # Get first tag for manifest name
          MANIFEST_NAME="${TAG_ARRAY[0]}"

          # Build label flags for podman
          LABEL_FLAGS=()
          for label in "${LABEL_ARRAY[@]}"; do
            LABEL_FLAGS+=("--label" "${label}")
          done

          # Build for each platform
          for PLATFORM in "${PLATFORM_ARRAY[@]}"; do
            ARCH=$(echo $PLATFORM | cut -d'/' -f2)
            echo "Building for platform: ${PLATFORM} (${ARCH})"

            if ! podman build \
              --platform=${PLATFORM} \
              --format=docker \
              --timestamp=${SOURCE_DATE_EPOCH} \
              "${LABEL_FLAGS[@]}" \
              --manifest=${MANIFEST_NAME} \
              -f Dockerfile \
              . ; then
              echo "Error: Build failed for platform ${PLATFORM}"
              exit 1
            fi

            echo "Successfully built for platform: ${PLATFORM}"
          done

          # Only push if not a PR
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            # Push manifest to all tags
            for TAG in "${TAG_ARRAY[@]}"; do
              echo "Pushing manifest to: ${TAG}"

              # If this is not the first tag, create a new manifest referencing the first
              if [[ "${TAG}" != "${MANIFEST_NAME}" ]]; then
                podman manifest create ${TAG}
                podman manifest add ${TAG} ${MANIFEST_NAME}
              fi

              # Push with all-images to push all architectures
              podman manifest push --all ${TAG} docker://${TAG}
            done
          fi

          # Get the manifest digest for signing
          DIGEST=$(podman manifest inspect ${MANIFEST_NAME} | jq -r '.manifests[0].digest')
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "Manifest digest: ${DIGEST}"

      - name: Debug Build
        run: echo "${{join(steps.build.outputs.*, '\n')}}"

      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: ${{ env.COSIGN_RELEASE_VERSION }}

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@43a17d6e7add2b5535efe4dcae9952337c479a93 # v0.20.11
        with:
          syft-version: ${{ env.SYFT_VERSION }}

      - name: Sign and Push
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        run: |
          IFS=',' read -ra TAG_ARRAY <<< "${IMAGE_TAGS}"
          for tag in "${TAG_ARRAY[@]}"; do
            # Use podman-compatible image reference
            if [[ -n "${IMAGE_DIGEST}" ]]; then
              image="${tag}@${IMAGE_DIGEST}"
            else
              # Fallback to getting digest from podman
              IMAGE_DIGEST=$(podman manifest inspect ${tag} 2>/dev/null | jq -r '.manifests[0].digest' || echo "")
              if [[ -n "${IMAGE_DIGEST}" ]]; then
                image="${tag}@${IMAGE_DIGEST}"
              else
                image="${tag}"
              fi
            fi

            original_name="sbom-${tag}.json"
            sanitized_name=$(echo "$original_name" | sed 's|[/:]|_|g' | tr '_-' '-_')
            echo "Signing the image: ${image}"
            echo "Using the original name: $original_name"
            echo "Using the sanitized name: $sanitized_name"
            echo "Signing and pushing ${image}"

            # Cosign works with both Docker and Podman images
            cosign sign --yes ${image}
            echo "Generating Software Bill of Materials for ${image}"

            # Syft can analyze Podman images
            syft ${image} -o spdx-json=${sanitized_name} -v
            echo "Attesting the Software Bill of Materials for ${image}"
            cosign attest --type=spdxjson --yes --predicate ${sanitized_name} ${image}
            echo "Done signing and pushing ${image} with SBOM"
          done
        shell: bash

      - name: Verify Signatures
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        run: |
          mkdir -p /tmp/cosign-verifications
          IFS=',' read -ra TAG_ARRAY <<< "${IMAGE_TAGS}"
          for tag in "${TAG_ARRAY[@]}"; do
            # Use podman-compatible image reference
            if [[ -n "${IMAGE_DIGEST}" ]]; then
              image="${tag}@${IMAGE_DIGEST}"
            else
              # Fallback to getting digest from podman
              IMAGE_DIGEST=$(podman manifest inspect ${tag} 2>/dev/null | jq -r '.manifests[0].digest' || echo "")
              if [[ -n "${IMAGE_DIGEST}" ]]; then
                image="${tag}@${IMAGE_DIGEST}"
              else
                image="${tag}"
              fi
            fi

            echo "Verifying ${image}"
            cosign verify ${image} --certificate-identity-regexp="${{vars.COSIGN_CERTIFICATE_IDENTITY}}" --certificate-oidc-issuer-regexp="${{vars.COSIGN_CERTIFICATE_OIDC_ISSUER}}" --output-file="/tmp/cosign-verifications/cosign-verify.json"
            echo "Verifying SBOM Attestation for ${image}"
            cosign verify-attestation ${image} --type=spdxjson --certificate-identity-regexp="${{vars.COSIGN_CERTIFICATE_IDENTITY}}" --certificate-oidc-issuer-regexp="${{vars.COSIGN_CERTIFICATE_OIDC_ISSUER}}" --output-file="/tmp/cosign-verifications/cosign-verify-attestation.json"
            echo "Done verifying ${image}"
          done
        shell: bash

      - name: Upload verification results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          path: /tmp/cosign-verifications
          name: cosign-verifications
          compression-level: 9
