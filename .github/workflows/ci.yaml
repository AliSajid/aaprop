---
name: Continuous integration
on:
  push:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  GIST_KEY: 625c1d8a63a7cbb926f8828d97d850b1 # pragma: allowlist secret
  RUST_BACKTRACE: 1
  MINIMUM_WAIT: 3
  MAXIMUM_WAIT: 10
jobs:
  check_changed_dirs:
    runs-on: ubuntu-latest
    outputs:
      source_changed: ${{steps.changed_dirs.outputs.source}}
      book_changed: ${{steps.changed_dirs.outputs.book}}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Check changed directories
        id: changed_dirs
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          base: ${{ github.ref }}
          filters: |
            source:
              - "src/**/*"
              - "tests/**/*"
              - "examples/**/*"
              - "Cargo.toml"
              - "Cargo.lock"
            book:
              - "guide/src/*.md"
              - "guide/book.toml"
  ci:
    runs-on: ${{matrix.os}}-latest
    needs: [check_changed_dirs]
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || github.event_name == 'workflow_dispatch'
    outputs:
      result: ${{steps.result.outputs.result}}
    strategy:
      fail-fast: false
      matrix:
        rust:
          - stable
          - beta
          - nightly
          - 1.78.0 # MSRV
        os:
          - ubuntu
        include:
          - os: ubuntu
            logo: ubuntu
          - rust: 1.78.0 # MSRV
            label: msrv
          - rust: stable
            label: stable
          - rust: beta
            label: beta
          - rust: nightly
            label: nightly
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install Rust
        if: ${{ needs.check_changed_dirs.outputs.source_changed == 'true' }}
        uses: dtolnay/rust-toolchain@0b1efabc08b657293548b77fb76cc02d26091c7e # master
        with:
          toolchain: ${{matrix.rust}}
          components: rustfmt, clippy
      - name: Install nightly Rust
        if: ${{ needs.check_changed_dirs.outputs.source_changed == 'true' }}
        uses: dtolnay/rust-toolchain@0b1efabc08b657293548b77fb76cc02d26091c7e # nightly
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - name: Cache dependencies
        if: ${{ needs.check_changed_dirs.outputs.source_changed == 'true' }}
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Cargo Build
        if: ${{ needs.check_changed_dirs.outputs.source_changed == 'true' }}
        run: cargo build --verbose
      - name: Cargo Test
        if: ${{ needs.check_changed_dirs.outputs.source_changed == 'true' }}
        run: cargo test
      - name: Cargo Format
        if: ${{ needs.check_changed_dirs.outputs.source_changed == 'true' }}
        run: cargo +nightly fmt --all -- --check
      - name: Cargo Lint
        if: ${{ needs.check_changed_dirs.outputs.source_changed == 'true' }}
        run: cargo clippy -- -D warnings
      - name: Wait before badge creation
        if: ${{ needs.check_changed_dirs.outputs.source_changed == 'true' }}
        uses: AliSajid/random-wait-action@ae53f7583f1e6c8e8e0fb4587865b586579b07c0 # v2.11.1
        with:
          minimum: ${{env.MINIMUM_WAIT}}
          maximum: ${{env.MAXIMUM_WAIT}}
      - name: Create Awesome Badge - Success
        uses: schneegans/dynamic-badges-action@e9a478b16159b4d31420099ba146cdc50f134483 # v1.7.0
        if: success()
        with:
          auth: ${{secrets.GIST_SECRET}}
          gistID: ${{env.GIST_KEY}}
          filename: ${{matrix.os}}-${{matrix.label}}.json
          label: Build
          namedLogo: ${{matrix.logo}}
          message: Succeeded
          color: green
      - name: Create Awesome Badge - Failure
        uses: schneegans/dynamic-badges-action@e9a478b16159b4d31420099ba146cdc50f134483 # v1.7.0
        if: failure()
        with:
          auth: ${{secrets.GIST_SECRET}}
          gistID: ${{env.GIST_KEY}}
          filename: ${{matrix.os}}-${{matrix.label}}.json
          namedLogo: ${{matrix.logo}}
          label: Build
          message: Failed
          isError: true
      - name: Set Result
        if: always()
        id: result
        run: echo "result=${{job.status}}" >> "$GITHUB_OUTPUT"
  generate_code_coverage:
    uses: ./.github/workflows/code_coverage.yaml
    needs: [ci, check_changed_dirs]
    if: ${{needs.check_changed_dirs.outputs.source_changed == 'true'}}
    secrets: inherit # pragma: allowlist secret
  generate_mdbook:
    uses: ./.github/workflows/deploy_mdbook.yaml
    needs: [check_changed_dirs]
    if: ${{needs.check_changed_dirs.outputs.book_changed == 'true'}}
    secrets: inherit # pragma: allowlist secret
  get-next-version:
    uses: ./.github/workflows/get_next_version.yaml
    needs: [ci, check_changed_dirs]
    if: ${{needs.ci.outputs.result == 'success'}}
    secrets: inherit # pragma: allowlist secret
  semantic-release:
    needs: [ci, get-next-version]
    if: ${{needs.get-next-version.outputs.new-release-published == 'true'}}
    uses: ./.github/workflows/release.yaml
    secrets: inherit # pragma: allowlist secret
  build-container:
    permissions:
      id-token: write
      packages: write
    needs: [ci]
    if: ${{! startsWith(github.ref, 'refs/heads/renovate/')}}
    uses: ./.github/workflows/build_container.yaml
    secrets: inherit # pragma: allowlist secret
